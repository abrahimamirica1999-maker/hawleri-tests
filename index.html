<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#A8701F">
<title>Post texts check</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EFF2F1; --surface:#FFFFFF; --raise:#F7F9F8;
  --ink:#16201E; --muted:#5E6D69; --faint:#8B9995;
  --line:#D4DCD9; --line-strong:#B9C5C1;
  --accent:#A8701F; --accent-ink:#7A4F12; --accent-soft:#F6E9D5;
  --done:#2E6B51; --done-soft:#E0EFE7; --on-accent:#FFFFFF;
  --fix:#FFF4C2; --fix-line:#E2C65A; --fix-ink:#6B5300;
  --lang:#E4EEFB; --lang-ink:#1F4C86;
  --shadow:0 1px 2px rgba(22,32,30,.06),0 8px 24px rgba(22,32,30,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1614; --surface:#18211F; --raise:#1E2926;
    --ink:#E7EEEB; --muted:#93A29D; --faint:#74837E;
    --line:#26332F; --line-strong:#35443F;
    --accent:#D19B4E; --accent-ink:#E9BE7C; --accent-soft:#2B2216;
    --done:#6FBF95; --done-soft:#172A21; --on-accent:#1B1206;
    --fix:#2C2610; --fix-line:#6B5A1E; --fix-ink:#E8D27A;
    --lang:#17243A; --lang-ink:#9DC1F0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1614; --surface:#18211F; --raise:#1E2926;
  --ink:#E7EEEB; --muted:#93A29D; --faint:#74837E;
  --line:#26332F; --line-strong:#35443F;
  --accent:#D19B4E; --accent-ink:#E9BE7C; --accent-soft:#2B2216;
  --done:#6FBF95; --done-soft:#172A21; --on-accent:#1B1206;
  --fix:#2C2610; --fix-line:#6B5A1E; --fix-ink:#E8D27A;
  --lang:#17243A; --lang-ink:#9DC1F0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Noto Kufi Arabic",system-ui,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 148px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--ground);padding-block:12px 8px}
.toprow{display:flex;align-items:center;gap:10px}
.brand{font-size:15px;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--faint)}
.count{margin-inline-start:auto;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end}
.count b{color:var(--ink);font-size:16px}
.bar{height:4px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .25s ease}
.sync{font-size:11.5px;color:var(--faint);margin-top:6px;min-height:16px}
.sync.on{color:var(--done)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px;box-shadow:var(--shadow);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--raise);
  color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.cat{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.ok{background:var(--done-soft);color:var(--done);border-color:transparent}
.h1{font-size:22px;font-weight:700;line-height:1.45;margin:2px 0 10px}
.p{color:var(--muted);white-space:pre-line}

/* ---------- group picker ---------- */
.groups{display:grid;gap:10px;margin-top:12px}
.grp{text-align:start;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);
  box-shadow:var(--shadow)}
.grp:hover{border-color:var(--accent)}
.grp b{display:block;font-size:18px;margin-bottom:4px}
.grp span{display:block;font-size:13px;color:var(--muted)}

/* ---------- section list ---------- */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;
  margin-top:12px}
.sec{text-align:start;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);
  box-shadow:var(--shadow)}
.sec:hover{border-color:var(--line-strong)}
.sec.full{background:var(--done-soft);border-color:transparent}
.sec.here{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sec b{display:block;font-size:14px;margin-bottom:5px}
.sec .sn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec .sbar{display:block;height:3px;border-radius:99px;background:var(--line);
  margin-top:7px;overflow:hidden}
.sec .sbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sec.full .sbar i{background:var(--done)}

/* ---------- one item ---------- */
.lang{background:var(--lang);color:var(--lang-ink);border-radius:12px;padding:9px 14px;
  font-weight:700;font-size:15px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:700;margin-bottom:4px;letter-spacing:.02em}
.ref{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.ref .lbl{color:var(--accent-ink)}
.ref .en{direction:ltr;text-align:left;font-family:system-ui,sans-serif;font-size:16px;line-height:1.55}
.ref .en + .en{margin-top:4px;font-size:14px;color:var(--muted)}
.ref .en.rtl{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic","Noto Kufi Arabic",serif}
.ctx{background:var(--raise);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:15px;color:var(--muted);margin-bottom:10px}
.ctx .lbl{color:var(--faint)}
.now{border:1.5px solid var(--line-strong);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.now .lbl{color:var(--muted)}
.now .t,.fix .t{font-size:20px;line-height:1.7;word-wrap:break-word;white-space:pre-wrap}
.fix{background:var(--fix);border-radius:12px;padding:12px 14px;margin-bottom:10px;
  box-shadow:inset 3px 0 0 var(--fix-line)}
.fix .lbl{color:var(--fix-ink)}
.why{direction:ltr;text-align:left;font-family:system-ui,sans-serif;font-size:13px;
  color:var(--muted);background:var(--raise);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.why b{font-weight:600;color:var(--faint)}
.ltr{direction:ltr;text-align:left;font-family:system-ui,sans-serif}
.lbl2{font-size:12px;color:var(--muted);margin:6px 0}
textarea,input.note{width:100%;border-radius:12px;border:1.5px solid var(--line-strong);
  background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit}
textarea{min-height:84px;resize:vertical;font-size:18px;line-height:1.8}
input.note{font-size:14px;padding:9px 12px}
textarea:focus,input.note:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.6}
.picked{font-size:13px;color:var(--done);font-weight:700;margin-top:8px}

/* ---------- buttons ---------- */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:12px;padding:11px 16px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:700}
button.good{background:var(--done-soft);border-color:transparent;color:var(--done);font-weight:700}
button.usefix{background:var(--fix);border-color:var(--fix-line);color:var(--fix-ink);font-weight:700}
button.ghost{background:transparent;border-color:var(--line)}
button.small{padding:6px 12px;font-size:13px}
button.nav{min-width:52px;font-size:18px;line-height:1}

.foot{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.footin{max-width:660px;margin:0 auto;display:flex;gap:8px;align-items:center}
.footin .primary{flex:1}

dialog{border:0;border-radius:16px;padding:0;background:transparent;max-width:92vw}
dialog::backdrop{background:rgba(10,16,15,.5)}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);max-width:420px}
.dlg h3{margin:0 0 8px;font-size:17px}
.dlg p{margin:0 0 6px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="top">
  <div class="wrap" style="padding-block:0">
    <div class="toprow">
      <div class="brand" id="brand">پێداچوونەوەی دەقەکانی پۆستەکان<small id="label">posts context</small></div>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill" style="width:0%"></i></div>
    <div class="sync" id="syncLine"></div>
  </div>
</div>

<div class="wrap">

  <!-- group picker -->
  <div id="scPick" hidden>
    <div class="card">
      <div class="h1">سڵاو 🌿 · مرحباً</div>
      <p class="p">بەشێک هەڵبژێرە · اختر مجموعة</p>
    </div>
    <div class="groups">
      <button class="grp" data-g="ar" dir="rtl"><b>العربية العراقية</b>
        <span id="pickAr"></span></button>
      <button class="grp" data-g="ku" dir="rtl"><b>کوردی</b>
        <span id="pickKu"></span></button>
    </div>
  </div>

  <!-- intro of a group -->
  <div id="scIntro" hidden>
    <div class="card">
      <div class="h1" id="introTitle"></div>
      <p class="p" id="introText"></p>
      <div class="btns"><button class="primary" id="btnStart"></button></div>
    </div>
  </div>

  <!-- section hub -->
  <div id="scHub" hidden>
    <div class="card">
      <div class="h1" id="hubTitle"></div>
      <p class="p" id="hubNote"></p>
      <div class="btns">
        <button class="primary" id="btnResume"></button>
        <button class="ghost small" id="btnGroup"></button>
      </div>
    </div>
    <div class="secs" id="secList"></div>
  </div>

  <!-- one text -->
  <div id="scItem" hidden>
    <div class="card">
      <div class="chips" id="itChips"></div>
      <div class="lang" id="itLang"></div>
      <div class="ref" id="itEnWrap" hidden>
        <div class="lbl" id="itEnLbl"></div>
        <div id="itEn"></div>
      </div>
      <div class="ctx" id="itInWrap" hidden>
        <div class="lbl" id="itInLbl"></div><span id="itIn"></span>
      </div>
      <div class="now">
        <div class="lbl" id="itNowLbl"></div>
        <div class="t" id="itNow"></div>
      </div>
      <div class="fix" id="itFixWrap" hidden>
        <div class="lbl" id="itFixLbl"></div>
        <div class="t" id="itFix"></div>
      </div>
      <div class="why" id="itWhyWrap" hidden><b>Why (AI / checks):</b> <span id="itWhy"></span></div>
      <div class="btns">
        <button class="usefix" id="btnFix"></button>
        <button class="good" id="btnKeep"></button>
      </div>
      <div class="lbl2" id="itOwnLbl"></div>
      <textarea id="itOwn" spellcheck="false"></textarea>
      <input class="note" id="itNote" type="text" autocomplete="off">
      <div class="picked" id="itPicked" hidden></div>
      <div class="hint" id="itHint"></div>
      <div class="btns"><button class="ghost small" id="btnHub"></button></div>
    </div>
  </div>

  <!-- section finished -->
  <div id="scSec" hidden>
    <div class="card">
      <div class="h1" id="secTitle"></div>
      <p class="p" id="secNote"></p>
      <div class="btns">
        <button class="primary" id="btnNextSec"></button>
        <button class="ghost" id="btnSecHub"></button>
      </div>
    </div>
  </div>

  <!-- group finished -->
  <div id="scDone" hidden>
    <div class="card">
      <div class="h1" id="doneTitle"></div>
      <p class="p" id="doneNote"></p>
      <div class="btns">
        <button class="primary" id="btnSend2"></button>
        <button class="ghost" id="btnDoneHub"></button>
      </div>
    </div>
  </div>
</div>

<div class="foot">
  <div class="footin">
    <button class="nav ghost" id="btnPrev" aria-label="previous">→</button>
    <button class="primary" id="btnNext"></button>
    <button class="nav ghost" id="btnSend" aria-label="send">↑</button>
  </div>
</div>

<dialog id="dlgSend"><div class="dlg">
  <h3 id="sendTitle"></h3>
  <p id="sendWarn"></p>
  <div class="btns">
    <button class="primary" id="doSend"></button>
    <button class="ghost" id="doAll"></button>
    <button class="ghost" id="doCopy"></button>
    <button class="ghost" id="doClose"></button>
  </div>
</div></dialog>

<script>
/* ────────────────────────────────────────────────────────────────────────────
   posts context (2026-11-10): the human check of every Arabic / Kurdish text of
   arabickurdishbot's Instagram posts (reel lines, word cards, translation lines,
   captions, hashtags), written by Gemini 3.1 Pro. Built from kawa-voice's page.
   Two groups: ar = Iraqi Arabic, ku = Kurdish (Standard Sorani or Hawleri).
   One section per post. items.json is written by review.py (story-shorts skill).
   An answer is "keep" (right), "own" (the reviewer wrote the right text) or
   "note". PAGING PAST RECORDS NOTHING (see kawa-voice). Answers go to the Google
   Sheet "posts context" through apps-script.gs (upsert on item_id).
   ──────────────────────────────────────────────────────────────────────────── */
var SHEET_URL="PASTE_SHEET_URL";
var QCACHE="posts_context_items", KEY="posts_context_v1", AR="٠١٢٣٤٥٦٧٨٩";
var lastPush=0, pushTimer=null, saveTimer=null;
var DATA=null, ALL=[], SECS=[], ITEMS=[], GSECS=[], BATCH="posts";
var st={g:"",v:"pick",cur:{ar:0,ku:0},ans:{},pend:{},synced:0,dev:""};

var WRITE_IN={iraqi:"Iraqi Arabic",std:"Standard Kurdish (Sorani)",hawleri:"Hawleri"};
var T={
 ku:{brand:"پێداچوونەوەی دەقەکانی پۆستەکان",
  pick:function(n){return ""+fa(n)+" دەق بە کوردی (سۆرانی)"},
  introTitle:"دەقە کوردییەکانی پۆستەکانمان لە ئینستاگرام",
  intro:function(n,s){return "ئەمە "+fa(n)+" دەقن لە "+fa(s)+" پۆستی ئینستاگرام (ڤیدیۆی کارتۆنی کورت و کاپشنەکانیان). ژیریی دەستکرد نووسیونی؛ تکایە دڵنیابەرەوە کە هەریەکەیان دروست و سروشتییە.\n\nلەسەر هەر دەقێک دەبینیت: واتاکەی بە ئینگلیزی، لە کوێی پۆستەکەدا دەردەکەوێت، کێ دەیڵێت، و هەمان دێڕ بە زمانەکەی تر.\n\n• ئەگەر دەقەکە دروستە: «دەقەکە دروستە، بیهێڵەوە» دابگرە\n• ئەگەر نا: دەقە دروستەکە لە بۆکسەکەدا بنووسە.\n\nهەموو ئەوەی دەیکەیت لە مۆبایلەکەتدا پاشەکەوت دەکرێت و خۆکارانە دەنێردرێت."},
  start:"دەست پێبکە", hub:"پۆستەکان",
  hubNote:function(f,n,s){return f?"لە "+fa(n)+" دەق، "+fa(f)+"ت تەواو کردووە. "+fa(n-f)+" ماوە.":fa(n)+" دەق لە "+fa(s)+" پۆستدا."},
  resume:"بەردەوام بە", allDone:"هەمووی تەواو بووە ✓", group:"گۆڕینی بەش (عەرەبی / کوردی)",
  of:" لە ", item:"دەقی ",
  lang:{std:"دەبێت بە کوردیی ستاندارد (سۆرانی) بنووسرێت",hawleri:"دەبێت بە هەولێری بنووسرێت"},
  enLbl:"مانا بە ئینگلیزی", inLbl:"هەمان دێڕ بە زمانەکەی تر", nowLbl:"دەقەکە ئێستا",
  fixLbl:"", useFix:"", keep:"دەقەکە دروستە، بیهێڵەوە",
  own:"یان دەقە ڕاستەکە لێرە بنووسە:", note:"تێبینی (ئەگەر هەتە)",
  hint:"تەنها ڕۆیشتن بۆ دەقی دواتر هیچ تۆمار ناکات؛ دوگمەیەک لێ بدە یان دەقەکە بگۆڕە.",
  picked:{keep:"✓ وەک خۆی دەمێنێتەوە",own:"✓ دەقی خۆت تۆمار کرا",note:"✓ تێبینییەکەت تۆمار کرا"},
  where:{"spoken": "لە ڤیدیۆکەدا دەگوترێت، وەک کارتی وشە پیشان دەدرێت", "trans": "دێڕی وەرگێڕان لە ژێر کارتەکانی وشە (ناگوترێت)", "cta": "لە کۆتایی ڤیدیۆکەدا دەگوترێت، یەک دێڕە دەق", "caption": "دێڕێک لە کاپشنی پۆستەکە", "tag": "هاشتاگێکی پۆستەکە"},
  who:{"arab": "پیاوە عەرەبەکە", "kurd": "پیاوە کوردەکە", "xal": "خاڵ (جادووگەرەکە)"},
  done:"تەواو ✓", next:"دواتر", secEnd:"کۆتایی پۆست", toHub:"لیستی پۆستەکان",
  secTitle:function(t){return "«"+t+"» تەواو بوو"},
  secNote:function(n,t){return n<t?"لەم پۆستەدا "+fa(n)+" لە "+fa(t)+" دەق تەواو بووە. دەتوانی بگەڕێیەوە و ئەوانی تریش تەواو بکەی.":"هەموو "+fa(t)+" دەقەکەی ئەم پۆستە تەواو بوون. زۆر سوپاس 🌿"},
  nextSec:"پۆستی دواتر", doneTitle:"تەواو بوو 🌿", doneNote:"زۆر سوپاس. هەموو شتێک پارێزراوە و نێردراوە.",
  sendAgain:"دووبارە بینێرە", send:"ناردن", doSend:"بینێرە", doAll:"هەمووی بنێرەوە", copy:"کۆپی بکە", copied:"کۆپی کرا ✓", close:"داخستن",
  sendWarn:function(f,n,p){return p?"لە "+fa(n)+" دەق، "+fa(f)+"ت تەواو کردووە. "+fa(p)+" هێشتا نەنێردراوە.":(f?"هەموو ئەوەی تەواوت کردووە ("+fa(f)+") نێردراوە ✓":"هێشتا هیچ وەڵامێک نییە.")},
  sending:"…ناردن", sent:"نێردرا ✓", offline:"ئینتەرنێت نییە — لە مۆبایلەکەت پارێزراوە",
  last:"دوایین ناردن ", waiting:function(p){return " — "+fa(p)+" چاوەڕێی ناردنە"},
  fail:"نەتوانرا دەقەکان باربکرێن. تکایە ئینتەرنێت بپشکنە و لاپەڕەکە تازە بکەرەوە."},
 ar:{brand:"راجع نصوص المنشورات",
  pick:function(n){return ""+fa(n)+" نصوص بالعراقي"},
  introTitle:"النصوص العراقية لمنشوراتنا على انستغرام",
  intro:function(n,s){return "هاي "+fa(n)+" نصوص من "+fa(s)+" منشورات انستغرام (فيديوهات كارتون قصيرة والوصف مالتها). الذكاء الاصطناعي كتبها؛ ياريت تتأكد إن كل واحد منها صحيح وطبيعي.\n\nبكل نص راح تشوف: معناه بالإنكليزي، وين يطلع بالمنشور، منو يكوله، ونفس الجملة باللغة الثانية.\n\n• إذا النص صحيح: دوس «النص صحيح، خليه»\n• إذا لا: اكتب النص الصحيح بالمربع.\n\nكل شي تسويه ينحفظ بتلفونك ويندز تلقائياً."},
  start:"ابدأ", hub:"المنشورات",
  hubNote:function(f,n,s){return f?"من "+fa(n)+" نصاً أكملتَ "+fa(f)+". بقي "+fa(n-f)+".":fa(n)+" نصاً في "+fa(s)+" منشورات."},
  resume:"تابع", allDone:"اكتمل كل شيء ✓", group:"تغيير المجموعة (عربي / كردي)",
  of:" من ", item:"النص ",
  lang:{iraqi:"يجب أن يُكتب باللهجة العراقية"},
  enLbl:"المعنى بالإنكليزية", inLbl:"نفس الجملة باللغة الثانية", nowLbl:"النص الآن",
  fixLbl:"", useFix:"", keep:"النص صحيح، خليه",
  own:"أو اكتب النص الصحيح هنا:", note:"ملاحظة (إن وُجدت)",
  hint:"الانتقال إلى النص التالي وحده لا يسجّل شيئاً؛ اضغط زراً أو عدّل النص.",
  picked:{keep:"✓ يبقى كما هو",own:"✓ تم تسجيل نصّك",note:"✓ تم تسجيل ملاحظتك"},
  where:{"spoken": "ينحجي بالفيديو، ويطلع على شكل بطاقات كلمات", "trans": "سطر الترجمة جوه بطاقات الكلمات (ما ينحجي)", "cta": "ينحجي بنهاية الفيديو، سطر نصي واحد", "caption": "سطر من وصف المنشور", "tag": "هاشتاك المنشور"},
  who:{"arab": "الرجال العربي", "kurd": "الرجال الكردي", "xal": "خال (الساحر)"},
  done:"تم ✓", next:"التالي", secEnd:"نهاية المنشور", toHub:"قائمة المنشورات",
  secTitle:function(t){return "انتهى «"+t+"»"},
  secNote:function(n,t){return n<t?"في هذا المنشور أكملتَ "+fa(n)+" من "+fa(t)+". يمكنك الرجوع وإكمال الباقي.":"اكتملت كل نصوص هذا المنشور ("+fa(t)+"). شكراً جزيلاً 🌿"},
  nextSec:"المنشور التالي", doneTitle:"اكتمل 🌿", doneNote:"شكراً جزيلاً. كل شيء محفوظ ومُرسل.",
  sendAgain:"أرسل مرة أخرى", send:"الإرسال", doSend:"أرسل", doAll:"أرسل الكل من جديد", copy:"نسخ", copied:"تم النسخ ✓", close:"إغلاق",
  sendWarn:function(f,n,p){return p?"من "+fa(n)+" نصاً أكملتَ "+fa(f)+". "+fa(p)+" لم يُرسل بعد.":(f?"كل ما أكملته ("+fa(f)+") قد أُرسل ✓":"لا توجد إجابات بعد.")},
  sending:"…جارٍ الإرسال", sent:"أُرسل ✓", offline:"لا يوجد إنترنت — محفوظ في هاتفك",
  last:"آخر إرسال ", waiting:function(p){return " — "+fa(p)+" بانتظار الإرسال"},
  fail:"تعذّر تحميل النصوص. تأكد من الإنترنت ثم أعد تحميل الصفحة."}
};

function fa(n){return String(n).replace(/\d/g,function(x){return AR[+x]})}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function L(){return T[st.g||"ku"]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,300)}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var p=JSON.parse(raw);
      st.g=p.g||""; st.v=p.v||"pick"; st.cur=p.cur||{ar:0,ku:0}; st.ans=p.ans||{};
      st.pend=p.pend||{}; st.synced=p.synced||0; st.dev=p.dev||"";}
  }catch(e){}
  if(!st.dev) st.dev="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  if(!st.g) st.v="pick";
}

/* ---- group ---- */
function setGroup(g){
  st.g=g; ITEMS=[]; GSECS=[];
  for(var i=0;i<ALL.length;i++) if(ALL[i].g===g) ITEMS.push(ALL[i]);
  for(var s=0;s<SECS.length;s++) if(SECS[s].g===g){
    var a=-1,b=-1;
    for(var j=0;j<ITEMS.length;j++) if(ITEMS[j].c===s){ if(a<0)a=j; b=j+1 }
    if(a>=0) GSECS.push({s:s,a:a,b:b,title:SECS[s].title,name:SECS[s].name});
  }
  if(!(st.cur[g]>=0)||st.cur[g]>=ITEMS.length) st.cur[g]=0;
  document.documentElement.lang = g==="ar"?"ar":"ckb";
  $("brand").firstChild.nodeValue=L().brand;
}
function cur(){return st.cur[st.g]}
function setCur(i){st.cur[st.g]=i}

/* ---- helpers ---- */
function gs(i){for(var k=0;k<GSECS.length;k++) if(i<GSECS[k].b) return k; return GSECS.length-1}
function answered(id){var a=st.ans[id];return !!(a&&(a.d||"").length)}
function filled(){var n=0;for(var i=0;i<ITEMS.length;i++) if(answered(ITEMS[i].id)) n++;return n}
function secFilled(k){var n=0;for(var i=GSECS[k].a;i<GSECS[k].b;i++) if(answered(ITEMS[i].id)) n++;return n}
function pendCount(){var n=0;for(var i=0;i<ITEMS.length;i++) if(st.pend[ITEMS[i].id]) n++;return n}
function firstOpen(){for(var i=0;i<ITEMS.length;i++) if(!answered(ITEMS[i].id)) return i;return -1}

/* ---- rendering ---- */
function renderPick(){
  var n={ar:0,ku:0}; for(var i=0;i<ALL.length;i++) n[ALL[i].g]++;
  $("pickAr").textContent=T.ar.pick(n.ar);
  $("pickKu").textContent=T.ku.pick(n.ku);
}
function renderHub(){
  var t=L(), f=filled(), o=firstOpen();
  $("hubTitle").textContent=t.hub;
  $("hubNote").textContent=t.hubNote(f,ITEMS.length,GSECS.length);
  $("btnResume").textContent= o<0 ? t.allDone : (f?t.resume:t.start);
  $("btnResume").disabled= o<0;
  $("btnGroup").textContent=t.group;
  var h=[], here=gs(cur());
  for(var k=0;k<GSECS.length;k++){
    var tot=GSECS[k].b-GSECS[k].a, n=secFilled(k), pc=Math.round(100*n/tot);
    h.push('<button class="sec'+(n===tot?" full":"")+(k===here?" here":"")+'" data-k="'+k+'">'+
      '<b>'+esc(GSECS[k].title)+(n===tot?' ✓':'')+'</b>'+
      '<span class="sn">'+fa(n)+t.of+fa(tot)+'</span>'+
      '<span class="sbar"><i style="width:'+pc+'%"></i></span></button>');
  }
  $("secList").innerHTML=h.join("");
  var bs=$("secList").getElementsByTagName("button");
  for(var q=0;q<bs.length;q++) bs[q].onclick=function(){
    var k=+this.getAttribute("data-k"), go=GSECS[k].a;
    for(var i=GSECS[k].a;i<GSECS[k].b;i++){ if(!answered(ITEMS[i].id)){go=i;break} }
    setCur(go); st.v="item"; save(); render(); window.scrollTo(0,0);
  };
}
function srcChip(by){
  var t=L(), out=[], parts=String(by||"").split(" + ");
  for(var i=0;i<parts.length;i++){
    var x=t.src[parts[i]]||t.srcAuto; if(out.indexOf(x)<0) out.push(x);
  }
  return out.join(" + ");
}
function courseChip(co){
  var t=L(), parts=String(co||"").split(" + "), out=[];
  for(var i=0;i<parts.length;i++) out.push(t.course[parts[i]]||parts[i]);
  return out.join(" + ");
}
function renderItem(){
  var t=L(), i=cur(), it=ITEMS[i], k=gs(i), g=GSECS[k], a=st.ans[it.id]||{};
  $("itChips").innerHTML=
    '<span class="chip cat">'+esc(g.title)+'</span>'+
    '<span class="chip">'+t.item+fa(i-g.a+1)+t.of+fa(g.b-g.a)+'</span>'+
    '<span class="chip">'+esc(t.where[it.wh]||"")+'</span>'+
    (it.s&&t.who[it.s]?'<span class="chip">'+esc(t.who[it.s])+'</span>':'')+
    (answered(it.id)?'<span class="chip ok">'+t.done+'</span>':'');
  $("itLang").textContent=t.lang[it.k]||"";
  var en=it.en||[];
  $("itEnWrap").hidden=!en.length; $("itEnLbl").textContent=t.enLbl;
  $("itEn").innerHTML=en.map(function(x){return '<div class="en">'+esc(x)+'</div>'}).join("");
  $("itInWrap").hidden=!it.x; $("itInLbl").textContent=t.inLbl; $("itIn").textContent=it.x||"";
  $("itNowLbl").textContent=t.nowLbl;
  $("itNow").textContent=it.t; $("itNow").className="t";
  $("itFixWrap").hidden=true; $("itWhyWrap").hidden=true; $("btnFix").hidden=true;
  $("btnKeep").textContent=t.keep;
  $("itOwnLbl").textContent=t.own;
  $("itOwn").value= a.d==="own" ? a.a : it.t;
  $("itOwn").className=""; $("itOwn").dir="rtl";
  $("itNote").placeholder=t.note; $("itNote").value=a.note||"";
  $("itPicked").hidden=!answered(it.id); $("itPicked").textContent=answered(it.id)?t.picked[a.d]:"";
  $("itHint").textContent=t.hint;
  $("btnHub").textContent=t.toHub;
  $("btnNext").textContent=(i+1>=g.b)?t.secEnd:t.next;
}
function renderSec(){
  var t=L(), k=gs(cur()), n=secFilled(k), tot=GSECS[k].b-GSECS[k].a;
  $("secTitle").textContent=t.secTitle(GSECS[k].title);
  $("secNote").textContent=t.secNote(n,tot);
  $("btnNextSec").textContent=t.nextSec; $("btnNextSec").hidden=k+1>=GSECS.length;
  $("btnSecHub").textContent=t.toHub;
}
function render(){
  var v=st.v;
  $("scPick").hidden=v!=="pick";
  $("scIntro").hidden=v!=="intro";
  $("scHub").hidden=v!=="hub";
  $("scItem").hidden=v!=="item";
  $("scSec").hidden=v!=="sec";
  $("scDone").hidden=v!=="done";
  $("btnNext").hidden=v!=="item"; $("btnPrev").hidden=v!=="item";
  $("btnSend").hidden=v==="pick";
  if(v==="pick"){ renderPick(); $("count").innerHTML=""; $("barfill").style.width="0%"; save(); return }
  var t=L();
  $("btnPrev").disabled=cur()<=0;
  if(v==="intro"){ $("introTitle").textContent=t.introTitle; $("introText").textContent=t.intro(ITEMS.length,GSECS.length);
    $("btnStart").textContent=t.start }
  if(v==="hub") renderHub();
  if(v==="item") renderItem();
  if(v==="sec") renderSec();
  if(v==="done"){ $("doneTitle").textContent=t.doneTitle; $("doneNote").textContent=t.doneNote;
    $("btnSend2").textContent=t.sendAgain; $("btnDoneHub").textContent=t.toHub }
  var f=filled();
  $("count").innerHTML="<b>"+fa(f)+"</b> / "+fa(ITEMS.length);
  $("barfill").style.width=(ITEMS.length?Math.round(100*f/ITEMS.length):0)+"%";
  save();
}

/* ---- answers ---- */
function setAns(it,d,a){
  var note=$("itNote").value.trim(), o=st.ans[it.id]||{};
  if(o.d===d&&o.a===a&&(o.note||"")===note) return;
  st.ans[it.id]={d:d,a:a,note:note}; st.pend[it.id]=1;
}
// Typing in the box: own text, unless it is back to the text now (or equals the suggestion).
// Paging past an untouched box must record NOTHING (see the header).
function commit(){
  if(st.v!=="item") return;
  var it=ITEMS[cur()], v=$("itOwn").value.trim(), note=$("itNote").value.trim(), o=st.ans[it.id];
  if(v&&v!==it.t) setAns(it,"own",v);
  else if(o&&(o.d==="own"||o.d==="fix")&&v===it.t){        // typed back to the text now: no own text any more
    if(note) setAns(it,"note",""); else { delete st.ans[it.id]; st.pend[it.id]=1 }
  }
  else if(o&&o.d) setAns(it,o.d,o.a);           // keeps the earlier choice, updates the note
  else if(note) setAns(it,"note","");
}
function goItem(d){
  commit();
  var i=cur(), k=gs(i), n=i+d;
  if(n<0) n=0;
  if(n>=GSECS[k].b){
    st.v=(k+1>=GSECS.length)?"done":"sec";
    save(); push(true); render(); window.scrollTo(0,0); return;
  }
  setCur(n); save(); push(); render(); window.scrollTo(0,0);
}
function toHub(){commit();st.v="hub";save();push();render();window.scrollTo(0,0)}

/* ---- payload ---- */
var DEC={keep:"keep as it is",fix:"take the suggestion",own:"reviewer wrote it",note:"note only",none:"(answer taken back)"};
var WHERE_EN={spoken:"spoken, word cards",trans:"translation line under the cards",cta:"spoken at the end (one line)",caption:"caption line",tag:"hashtag"};
function rowOf(it){
  var a=st.ans[it.id]||{d:"none"}, fixed=a.d==="keep"?it.t:(a.d==="note"||a.d==="none")?"":a.a;
  return {id:it.id,group:it.g==="ar"?"Iraqi Arabic":"Kurdish",row:it.r,section:SECS[it.c].name,
          course:WHERE_EN[it.wh]||it.wh,write_in:WRITE_IN[it.k],english:(it.en||[]).join(" | "),text_now:it.t,
          suggested_fix:it.x||"",decision:DEC[a.d],correct_text:fixed,
          changed:(a.d==="note"||a.d==="none")?"":(fixed===it.t?"no":"yes"),note:a.note||""};
}
function rows(all){
  var out=[];
  for(var i=0;i<ALL.length;i++){
    var it=ALL[i];
    if(all?!answered(it.id):!st.pend[it.id]) continue;   // a taken-back answer is sent once, as "(answer taken back)"
    out.push(rowOf(it));
  }
  return out;
}
function payload(r){return JSON.stringify({device:st.dev,batch:BATCH,at:new Date().toISOString(),rows:r})}
var COLS=["group","row","section","course","write_in","english","text_now","suggested_fix","decision","correct_text","changed","note","id"];
function csv(){
  var r=[COLS], R=rows(true);
  for(var k=0;k<R.length;k++) r.push(COLS.map(function(c){return R[k][c]}));
  return r.map(function(x){return x.map(function(c){
    c=String(c==null?"":c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c
  }).join(",")}).join("\r\n");
}
function stamp(){
  if(!st.synced||!st.g) return "";
  var d=new Date(st.synced), p=pendCount();
  function two(x){return (x<10?"0":"")+x}
  return L().last+two(d.getHours())+":"+two(d.getMinutes())+(p?L().waiting(p):"");
}
function push(force,all){
  if(!SHEET_URL||SHEET_URL.indexOf("PASTE_")===0) return;
  if(!force&&Date.now()-lastPush<4000){
    clearTimeout(pushTimer); pushTimer=setTimeout(function(){push(true)},4000); return;
  }
  var sending=rows(!!all); if(!sending.length) return;
  var sent={}; for(var k=0;k<sending.length;k++) sent[sending[k].id]=JSON.stringify(sending[k]);
  lastPush=Date.now();
  var line=$("syncLine"); line.className="sync"; line.textContent=L().sending;
  fetch(SHEET_URL,{method:"POST",mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload(sending)
  }).then(function(){
    // still pending if it changed while the post was out
    for(var id in sent){ var it=null;
      for(var i=0;i<ALL.length;i++) if(ALL[i].id===id){it=ALL[i];break}
      if(it&&JSON.stringify(rowOf(it))===sent[id]) delete st.pend[id];
    }
    st.synced=Date.now(); save();
    line.className="sync on"; line.textContent=L().sent;
    setTimeout(function(){line.className="sync";line.textContent=stamp()},2500);
  }).catch(function(){
    line.className="sync"; line.textContent=L().offline;
  });
}
function beacon(){
  if(!SHEET_URL||SHEET_URL.indexOf("PASTE_")===0||!navigator.sendBeacon) return;
  var sending=rows(false); if(!sending.length) return;
  try{
    var body=new Blob([payload(sending)],{type:"text/plain;charset=utf-8"});
    if(navigator.sendBeacon(SHEET_URL,body)){
      for(var k=0;k<sending.length;k++) delete st.pend[sending[k].id];
      st.synced=Date.now(); save();
    }
  }catch(e){}
}
function openSend(){
  var t=L();
  $("sendTitle").textContent=t.send; $("doSend").textContent=t.doSend; $("doAll").textContent=t.doAll;
  $("doCopy").textContent=t.copy; $("doClose").textContent=t.close;
  $("sendWarn").textContent=t.sendWarn(filled(),ITEMS.length,pendCount());
  $("dlgSend").showModal();
}

/* ---- events ---- */
function bind(){
  var gb=document.querySelectorAll(".grp");
  for(var q=0;q<gb.length;q++) gb[q].onclick=function(){
    var g=this.getAttribute("data-g"), seen=false;
    for(var id in st.ans){ for(var i=0;i<ALL.length;i++) if(ALL[i].id===id&&ALL[i].g===g){seen=true;break} if(seen)break }
    setGroup(g); st.v=seen?"hub":"intro"; save(); render(); window.scrollTo(0,0);
  };
  $("btnStart").onclick=function(){st.v="hub";save();render();window.scrollTo(0,0)};
  $("btnResume").onclick=function(){
    var o=firstOpen(); if(o>=0) setCur(o);
    st.v="item"; save(); render(); window.scrollTo(0,0);
  };
  $("btnGroup").onclick=function(){st.v="pick";save();render();window.scrollTo(0,0)};
  $("btnNext").onclick=function(){goItem(1)};
  $("btnPrev").onclick=function(){goItem(-1)};
  $("btnHub").onclick=toHub; $("btnSecHub").onclick=toHub; $("btnDoneHub").onclick=toHub;
  $("btnNextSec").onclick=function(){
    var k=gs(cur())+1;
    if(k>=GSECS.length){st.v="done"} else {setCur(GSECS[k].a); st.v="item"}
    save(); render(); window.scrollTo(0,0);
  };
  $("btnFix").onclick=function(){var it=ITEMS[cur()]; $("itOwn").value=it.f; setAns(it,"fix",it.f); goItem(1)};
  $("btnKeep").onclick=function(){var it=ITEMS[cur()]; $("itOwn").value=it.t; setAns(it,"keep",it.t); goItem(1)};
  $("btnSend").onclick=openSend; $("btnSend2").onclick=openSend;
  $("doClose").onclick=function(){$("dlgSend").close()};
  $("doSend").onclick=function(){push(true);$("dlgSend").close()};
  $("doAll").onclick=function(){push(true,true);$("dlgSend").close()};
  $("doCopy").onclick=function(){
    var b=$("doCopy"), txt=csv();
    function ok(){b.textContent=L().copied;setTimeout(function(){b.textContent=L().copy},2000)}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt,ok)});
    }else fallback(txt,ok);
  };
  function fallback(txt,ok){
    var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);
    a.select();try{document.execCommand("copy");ok()}catch(e){}
    document.body.removeChild(a);
  }
  $("itOwn").addEventListener("input",function(){commit();saveSoon()});
  $("itNote").addEventListener("input",function(){commit();saveSoon()});
  window.addEventListener("pagehide",function(){commit();save();beacon()});
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden"){commit();save();beacon()}
  });
}

/* ---- boot ---- */
function boot(data){
  DATA=data; SECS=data.sections||[]; ALL=data.items||[]; BATCH=data.batch||"typos";
  try{localStorage.setItem(QCACHE,JSON.stringify(data))}catch(e){}
  load(); if(st.g) setGroup(st.g);
  bind(); render();
  $("syncLine").textContent=stamp();
  push(true);
}
function fail(){
  $("scPick").hidden=false;
  $("pickAr").textContent=T.ar.fail; $("pickKu").textContent=T.ku.fail;
  $("btnNext").hidden=true; $("btnPrev").hidden=true;
}
fetch("items.json?v="+Date.now()).then(function(r){
  if(!r.ok) throw 0; return r.json();
}).then(boot).catch(function(){
  try{ var c=localStorage.getItem(QCACHE); if(c){boot(JSON.parse(c));return} }catch(e){}
  fail();
});
</script>
</body>
